spring:
  application:
    name: agentic-url-shortener
  datasource:
    url: jdbc:postgresql://localhost:5432/agentic
    username: agentic
    password: agentic
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

agentic:
  url:
    base-domain: http://localhost:8080
    short-code-length: 7
    allowed-schemes: http,https
    max-url-length: 2048
    default-expiry-days: 365
  visitor-hash:
    salt: ${VISITOR_HASH_SALT:change-me-in-prod}
  orchestrator:
    scheduler-tick-ms: 200
    default-max-retries: 2
  agent:
    llm:
      mode: mock   # mock | real
    real:
      provider: anthropic
      model: claude-sonnet-5
      api-key: ${ANTHROPIC_API_KEY:}
  events:
    publisher: in-process   # in-process | kafka (Scenario 2b seam)

logging:
  level:
    com.example.agentic: INFO
